<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130">
  <defs>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Isometric rounded cube built from smaller cubes -->
  <g transform="translate(64 65)" filter="url(#glow)" stroke-linejoin="round" stroke-linecap="round">
    <g>
      
      <!-- big cube -->
      <path d="M0 -38 L33 -19 L33 19 L0 38 L-33 19 L-33 -19 Z" fill="rgba(3,8,16,0.85)" stroke="url(#edge)" stroke-width="2.2"/>
      <path d="M-33 -19 L0 0 L33 -19 M0 0 L0 38" fill="none" stroke="url(#edge)" stroke-width="1.6" opacity="0.9"/>
      <!-- inner grid: the cube is made of cubes -->
      <path d="M-16.5 -28.5 L16.5 -9.5 M16.5 -28.5 L-16.5 -9.5 M-16.5 9.5 L-16.5 28.5 M16.5 9.5 L16.5 28.5 M-33 0 L0 19 M33 0 L0 19" fill="none" stroke="#7dd3fc" stroke-width="0.8" opacity="0.45"/>
      <!-- top face highlight -->
      <path d="M0 -38 L33 -19 L0 0 L-33 -19 Z" fill="#38bdf8" opacity="0.14"/>
    </g>
    <!-- small cubes flying in -->
    <g opacity="0.95">
      <path d="M44 -40 l8 4.6 v9.2 l-8 4.6 l-8 -4.6 v-9.2 z" fill="rgba(3,8,16,0.9)" stroke="#7dd3fc" stroke-width="1.3">
        
      </path>
      <path d="M-50 28 l5.5 3.2 v6.4 l-5.5 3.2 l-5.5 -3.2 v-6.4 z" fill="none" stroke="#38bdf8" stroke-width="1.2">
        
      </path>
      <path d="M40 30 l4 2.3 v4.6 l-4 2.3 l-4 -2.3 v-4.6 z" fill="#0ea5e9" fill-opacity="0.35" stroke="#bae6fd" stroke-width="1">
        
      </path>
    </g>
  </g>

  <text x="135" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="url(#txt)">React Kit</text>
  <text x="135" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="url(#txt)" opacity="0.85">Components</text>
</svg>
