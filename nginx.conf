server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify's TLS proxy: keep redirects relative so they stay on https.
    absolute_redirect off;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Next.js hashed assets: cache for 1 year
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?|txt|xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Static pages (/docs/glass-button/ → docs/glass-button/index.html).
    # HTML is never cached so deploys show up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }
}
